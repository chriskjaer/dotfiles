###########################
# Status Bar
###########################

# set refresh interval for status bar
set -g status-interval 5

# left-justify the bar
set -g status-justify left

# force bottom bar (overrides external theme)
set -g status-position bottom

# size
set -g status-left-length 100
set -g status-right-length 100

# left: session name
set -g status-left '#[fg=#bb9af7] #S '

# right: host + clock
set -g status-right '#[fg=#bb9af7] #H #[fg=#7dcfff] %H:%M #[fg=#565f89] %a %d %b '

# layout: left session + window list, centered flags, right host/clock
set -g status-format[0] '#[align=left]#{E:status-left}#{W:#{E:window-status-format},#{E:window-status-current-format}}#[align=centre]#{?client_prefix,#[fg=#e0af68] PREFIX ,}#{?window_zoomed_flag,#[fg=#bb9af7] ZOOM ,}#{?mouse, ,#[fg=#e0af68] MOUSE OFF }#[align=right]#{E:status-right}'

# windows
set -g window-status-separator ''
set -g window-status-format '#[fg=#565f89] #I:#W#{?window_bell_flag, #[fg=#e0af68][!]#[fg=#565f89],#{?window_activity_flag, #[fg=#e0af68][!]#[fg=#565f89],}} '
set -g window-status-current-format '#[fg=#7dcfff,bold] #I:#W #{?window_bell_flag, #[fg=#e0af68][!],#{?window_activity_flag, #[fg=#e0af68][!],}}'
