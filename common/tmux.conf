# Using sensible tmux defaults via plugin
# See https://github.com/tmux-plugins/tmux-sensible

# List of plugins
# Supports `github_username/repo` or full git URLs
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# smart pane switching with awareness of vim splits
# https://github.com/christoomey/vim-tmux-navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

# fzf text selection
set -g @plugin 'laktak/extrakto'


# act like vim
setw -g mode-keys vi
# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R
# bind-key -r C-h select-window -t :-
# bind-key -r C-l select-window -t :+

# act like GNU screen
unbind C-b
set -g prefix C-a

# Ghostty: Option+Left/Right send M-b/M-f (word movement), use for resize.
bind-key -r -T prefix M-b resize-pane -L 5
bind-key -r -T prefix M-f resize-pane -R 5

# Let Ctrl+J through for multiline input; use Alt+J for pane down.
unbind -n C-j
bind-key -n C-j send-keys C-j
bind-key -n M-j select-pane -D

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1

# renumber windows sequentially after closing any of them
set -g renumber-windows on

set -as terminal-overrides ',*:Tc'

# highlight current window
# set-window-option -g window-status-current-bg default
# set-window-option -g window-status-current-fg colour8

# fix weird escape bug in neovim. See https://github.com/neovim/neovim/issues/2017
set -s escape-time 0

# switch to last pane
bind-key C-a last-pane

# pane border colors
# set -g pane-border-fg white
# set -g pane-active-border-fg green
# set -g pane-active-border-bg default

set -g focus-events off
set -g history-limit 10000
set -g set-clipboard on

# proper key support
set-window-option -g xterm-keys on

# macOS uses reattach-to-user-namespace for clipboard; only set if available
if-shell -b 'command -v reattach-to-user-namespace >/dev/null' 'set-option -g default-command "reattach-to-user-namespace -l zsh"'
set -g default-terminal "tmux-256color"

# Change divider char to ascii. Fixes hyperterm issue
set-option -ga terminal-overrides ',*:enacs@:smacs@:rmacs@:acsc@'

# Tmux Vim-bindings for copying into tmux buffer
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Clipboard integration across macOS/Wayland/X11
if-shell -b 'command -v reattach-to-user-namespace >/dev/null' 'set -g @copy_command "reattach-to-user-namespace pbcopy"'
if-shell -b 'test -z "#{@copy_command}" && command -v wl-copy >/dev/null' 'set -g @copy_command "wl-copy"'
if-shell -b 'test -z "#{@copy_command}" && command -v xclip >/dev/null' 'set -g @copy_command "xclip -selection clipboard"'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Theme + status
if-shell -b '[ -f ~/.tmux/theme.conf ]' 'source-file ~/.tmux/theme.conf'
if-shell -b '[ -f ~/.tmux/status.conf ]' 'source-file ~/.tmux/status.conf'

# initializes TMUX plugin manager
# Prefer Omarchy theme on Linux if present.
if-shell -b '[ -f ~/.config/omarchy/current/theme/tmux.conf ]' 'source-file ~/.config/omarchy/current/theme/tmux.conf'
run '~/.tmux/plugins/tpm/tpm'

# Enable mouse for pane resize/selection.
set -g mouse on
